AWSTemplateFormatVersion: '2010-09-09'
Description: Plantilla que crea un bucket S3 público para alojar una página web estática

Parameters:

  BucketName:
    Type: String
    Description: Nombre unico del bucket S3 (debe ser globalmente único)


Resources:

  StaticWebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: error.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  StaticWebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticWebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: "s3:GetObject"
            Resource: !Sub "${StaticWebsiteBucket.Arn}/*"

Outputs:

  WebsiteURL:
    Description: URL pública del sitio web en S3
    Value: !GetAtt StaticWebsiteBucket.WebsiteURL

  BucketNameOutput:
    Description: Nombre del bucket creado
    Value: !Ref StaticWebsiteBucket
